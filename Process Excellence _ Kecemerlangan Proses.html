<style>
:root{
  --bg:#F2F5F7;--card:#FFFFFF;--ink:#10253A;--mute:#52667A;--line:#D5DEE6;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1822;--card:#16242F;--ink:#E8EEF3;--mute:#9DB0BF;--line:#29404F;
  --ag:#F2A04A;--ls:#2DB5B7;--dt:#A48CF2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1822;--card:#16242F;--ink:#E8EEF3;--mute:#9DB0BF;--line:#29404F;--ag:#F2A04A;--ls:#2DB5B7;--dt:#A48CF2;color-scheme:dark}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,system-ui,sans-serif;line-height:1.1;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:6px;padding:10px 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);overflow-x:auto}
nav b{font-family:'Bricolage Grotesque',sans-serif;font-size:18px;margin-right:auto;white-space:nowrap}
nav a{color:var(--mute);text-decoration:none;padding:6px 12px;border-radius:99px;font-weight:500;font-size:15px;white-space:nowrap}
nav a:hover{color:var(--ink);background:var(--line)}
.lang{display:flex;border:1.5px solid var(--line);border-radius:99px;padding:2px;margin-left:8px}
.lang button{border:0;background:none;padding:4px 12px;border-radius:99px;font-weight:600;font-size:14px;color:var(--mute)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
section{max-width:1080px;margin:0 auto;padding:84px 22px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;min-height:calc(100svh - 60px);padding-top:30px}
.hero h1{font-size:clamp(40px,6.4vw,76px);font-weight:800;letter-spacing:-.03em}
.hero p{color:var(--mute);max-width:46ch;font-size:19px;margin:20px 0 28px}
.stats{display:flex;gap:30px;flex-wrap:wrap}
.stats div{border-left:3px solid var(--accent);padding-left:12px}
.stats strong{display:block;font:800 34px 'Bricolage Grotesque',sans-serif}
.stats span{color:var(--mute);font-size:14px}
/* ring */
.ring{width:100%;max-width:440px;margin:auto;overflow:visible}
.ring .track{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:3 8;animation:dash 20s linear infinite}
@keyframes dash{to{stroke-dashoffset:-110}}
.spin{transform-origin:160px 160px;animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.node{cursor:pointer;outline:none}
.node circle{transition:transform .35s cubic-bezier(.3,1.6,.5,1),fill .2s;transform-box:fill-box;transform-origin:center}
.node:hover circle,.node:focus-visible circle{transform:scale(1.22)}
.node text{font:800 17px 'Bricolage Grotesque',sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.07)}}
#ringLabel{font:700 15px 'Bricolage Grotesque',sans-serif;fill:var(--ink);text-anchor:middle}
#ringSub{font:400 11px Figtree,sans-serif;fill:var(--mute);text-anchor:middle}
/* shared */
.head{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.head i{width:14px;height:44px;border-radius:7px;background:var(--c)}
.head h2{font-size:clamp(30px,4.4vw,50px);letter-spacing:-.02em}
.lead{color:var(--mute);max-width:62ch;margin:0 0 34px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;font-size:15px;transition:.25s}
#agile{--c:var(--ag)}#lss{--c:var(--ls)}#dt{--c:var(--dt)}
/* kanban */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col{background:color-mix(in srgb,var(--ag) 8%,var(--card));border:1px solid var(--line);border-radius:14px;padding:10px;min-height:210px}
.col h3{font-size:15px;margin:2px 4px 10px;display:flex;justify-content:space-between}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--ag);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:15px;line-height:1.35;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.12)}
.card.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.8) translateX(-18px);opacity:0}}
.col.done .card{border-left-color:var(--ls);opacity:.85}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:16px 0 6px}
.bar i{display:block;height:100%;width:0;background:var(--c,var(--ag));border-radius:9px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;color:var(--mute);font-size:15px}
.link{background:none;border:0;color:var(--accent);font-weight:600;text-decoration:underline;padding:4px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
/* lss */
.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{flex:1;border:1.5px solid var(--line);background:none;border-radius:12px;padding:10px 0;font:700 20px 'Bricolage Grotesque',sans-serif;transition:.25s}
.tabs button[aria-selected="true"]{background:var(--ls);border-color:var(--ls);color:#fff;transform:translateY(-3px)}
.swap{animation:swap .4s ease}
@keyframes swap{from{opacity:0;transform:translateY(8px)}}
.panel h3{font-size:26px;margin-bottom:8px}
.panel p{margin:0 0 10px}
.tool{color:var(--c);font-weight:600;font-size:15px}
input[type=range]{width:100%;accent-color:var(--ls);margin:10px 0}
.big{font:800 52px/1 'Bricolage Grotesque',sans-serif;color:var(--ls)}
.waste{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.waste .chip.on{background:var(--ls);border-color:var(--ls);color:#fff;text-decoration:line-through;transform:rotate(-2deg) scale(.96)}
/* dt */
.steps{position:relative;display:flex;justify-content:space-between;margin:10px 0 28px}
.steps::before,.steps .fill{content:"";position:absolute;left:5%;right:5%;top:22px;height:4px;border-radius:4px;background:var(--line)}
.steps .fill{right:auto;width:0;background:var(--dt);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.step{position:relative;z-index:1;flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--mute)}
.step b{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:3px solid var(--line);font:800 18px 'Bricolage Grotesque',sans-serif;transition:.35s}
.step.reached b{border-color:var(--dt);color:var(--dt)}
.step.now b{background:var(--dt);color:#fff;transform:scale(1.2)}
.step.now{color:var(--ink)}
.nav2{display:flex;gap:10px;margin-top:14px}
.btn{border:0;background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;font-weight:600}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
/* pick */
#pick{--c:var(--accent)}
.opts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.opts button{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 18px;font-weight:500;transition:.25s}
.opts button[aria-pressed="true"]{border-color:var(--rc);box-shadow:inset 0 0 0 1.5px var(--rc);transform:translateY(-3px)}
footer{text-align:center;color:var(--mute);padding:40px 20px 60px;border-top:1px solid var(--line);font-size:15px}
@media (max-width:820px){
  .hero{grid-template-columns:1fr;min-height:0}.ring{max-width:320px}
  .board{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}
  .step{font-size:11px}.step b{width:38px;height:38px}.steps::before,.steps .fill{top:17px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>

  const d=cols.filter(v=>v===3).length;
  $('#aBar').style.width=d/cols.length*100+'%';$('#aTxt').textContent=t.done(d,cols.length);
  $('#aTags').innerHTML=t.tags.map(x=>`<span class="chip">${x}</span>`).join('');
}
function tabs(){
  const t=T[L];
  $('#tabs').innerHTML=t.dmaic.map((x,i)=>`<button role="tab" aria-selected="${i===tab}" data-i="${i}" title="${x[0]}">${'DMAIC'[i]}</button>`).join('');
  const x=t.dmaic[tab];
  $('#dmaic').innerHTML=`<div class="swap"><h3>${x[0]}</h3><p>${x[1]}</p><p class="tool" style="--c:var(--ls)">${x[2]}</p></div>`;
}
function sigma(first){
  $('#sigV').textContent=sig;const v=DPMO[sig];
  const el=$('#dpmo');countTo(el,v,sig===6);
  const y=(1-v/1e6)*100;$('#yBar').style.width=y+'%';$('#yTxt').textContent=y.toFixed(sig>=5?4:2)+'%';
}
function waste(){
  const t=T[L];
  $('#waste').innerHTML=t.wastes.map((w,i)=>`<button class="chip ${spotted.has(i)?'on':''}" data-i="${i}">${w}</button>`).join('');
  $('#wCount').textContent=t.wc(spotted.size);
}
function dt(){
  const t=T[L],x=t.dt[stage];
  $('#steps').innerHTML=`<div class="fill" id="fill" style="width:${stage/4*90}%"></div>`+t.dt.map((s,i)=>
    `<button class="step ${i<=stage?'reached':''} ${i===stage?'now':''}" data-i="${i}"><b>${i+1}</b>${s[0]}</button>`).join('');
  $('#dtBody').innerHTML=`<div class="swap"><h3>${x[0]}</h3><p>${x[1]}</p><p class="tool" style="--c:var(--dt)">${x[2]}</p></div>`;
  $('#prev').textContent=t.prev;$('#prev').disabled=stage===0;
  $('#next').textContent=stage===4?t.restart:t.next;
}
function pick(){
  const t=T[L];
  $('#opts').innerHTML=t.sit.map((s,i)=>`<button data-i="${i}" aria-pressed="${i===sit}" style="--rc:${COL[i]}">${s}</button>`).join('');
  const r=t.rec[sit];
  $('#rec').innerHTML=sit<0?`<span style="color:var(--mute)">${t.p_l}</span>`:
    `<div class="swap"><h3 style="color:${COL[sit]}">${r[0]}</h3><p style="margin:0">${r[1]}</p></div>`;
}
function setLang(l){
  L=l;document.documentElement.lang=l==='ms'?'ms':'en';
  $$('[data-i18n]').forEach(e=>e.textContent=T[l][e.dataset.i18n]);
  $$('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l));
  board();tabs();waste();dt();pick();
  $('#ringSub').textContent=l==='ms'?'ketik nod':'tap a node';
  $('#ringLabel').textContent=l==='ms'?'Kecemerlangan Proses':'Process Excellence';
}
/* events */
$$('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
$('#board').onclick=e=>{const c=e.target.closest('.card');if(!c)return;
  const i=+c.dataset.i;cols[i]=Math.min(3,cols[i]+1);moved=i;board();moved=-1};
$('#aReset').onclick=()=>{cols=[0,0,0,1,2];board()};
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b){tab=+b.dataset.i;tabs()}};
$('#sig').oninput=e=>{sig=+e.target.value;sigma()};
$('#waste').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const i=+b.dataset.i;
  spotted.has(i)?spotted.delete(i):spotted.add(i);waste()};
$('#steps').onclick=e=>{const b=e.target.closest('.step');if(b){stage=+b.dataset.i;dt()}};
$('#prev').onclick=()=>{stage=Math.max(0,stage-1);dt()};
$('#next').onclick=()=>{stage=stage===4?0:stage+1;dt()};
$('#opts').onclick=e=>{const b=e.target.closest('button');if(b){sit=+b.dataset.i;pick()}};
$$('.node').forEach(n=>{
  const lbl=$('#ringLabel');
  const on=()=>lbl.textContent=n.dataset.k,off=()=>lbl.textContent=L==='ms'?'Kecemerlangan Proses':'Process Excellence';
  n.onmouseenter=n.onfocus=on;n.onmouseleave=n.onblur=off;
  const go=()=>document.getElementById(n.dataset.go).scrollIntoView({behavior:'smooth'});
  n.onclick=go;n.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}};
});
/* init */
setLang('en');sigma();
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){
  const el=e.target;countTo(el,+el.dataset.count,el.dataset.count.includes('.'));io.unobserve(el)}}),{threshold:.6});
$$('[data-count]').forEach(el=>io.observe(el));
</script>
</body>
</html>
